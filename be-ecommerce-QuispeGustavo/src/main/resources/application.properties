// --- application.properties ---
spring.application.name=api-pedidos
server.port=8080

# Configuracion JDBC MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_ecommerce_QuispeGustavo 
spring.datasource.username=root
spring.datasource.password=AD777o

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# CONFIGURACIÓN DE JWT (SECURITY)
# ==========================================
# La clave secreta debe tener al menos 256 bits (32 caracteres) de longitud. jwt.secret.key=EstaEsUnaClaveSuperSecretaYLoSuficientementeLargaParaCumplirConJJWT256Bits!!
jwt.expiration.ms=86400000
# ==========================================
# CONFIGURACIÓN DE CORS EXTERNALIZADA
# ==========================================
# En desarrollo local (soporta múltiples orígenes separados por coma)
cors.allowed-origins=http://localhost:4200

